<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo -->
  <rect width="800" height="800" fill="#0f172a"/>
  
  <!-- Grid de fondo estilo "código" -->
  <g stroke="#4684e7" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
  </g>

  <!-- Resplandor azul -->
  <circle cx="400" cy="350" r="250" fill="#ecec0a" opacity="0.1" filter="url(#blur)"/>

  <defs>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- CAPUCHA (forma grande detrás) -->
  <path d="M400 150 C250 150 180 280 190 420 L170 550 L260 500 L280 600 L350 540 
           L400 620 L450 540 L520 600 L540 500 L630 550 L610 420 C620 280 550 150 400 150 Z" 
        fill="#ecec0a" stroke="#000000" stroke-width="4"/>

  <!-- Interior de la capucha (sombra) -->
  <ellipse cx="400" cy="360" rx="145" ry="160" fill="#18181a"/>

  <!-- CARA -->
  <ellipse cx="400" cy="370" rx="115" ry="125" fill="#f8fafc" filter="url(#soft)"/>

  <!-- PELO asomando bajo la capucha -->
  <path d="M300 280 C320 240 360 230 400 235 C440 230 480 240 500 280 
           L490 300 L470 270 L450 300 L430 265 L400 295 L370 265 L350 300 L330 270 L310 300 Z" 
        fill="#0b0b0b"/>

  <!-- VISOR DE CÓDIGO (barra sobre los ojos, estilo cyberpunk) -->
  <rect x="290" y="330" width="220" height="50" rx="25" fill="#d0db04" stroke="#e3df12" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Líneas de código dentro del visor -->
  <g stroke="#ecec0a" stroke-width="3" stroke-linecap="round">
    <line x1="315" y1="348" x2="360" y2="348"/>
    <line x1="315" y1="362" x2="345" y2="362"/>
    <line x1="440" y1="348" x2="485" y2="348"/>
    <line x1="455" y1="362" x2="485" y2="362"/>
  </g>
  <circle cx="400" cy="355" r="8" fill="#fbbf24" filter="url(#glow)"/>

  <!-- Nariz -->
  <path d="M400 395 L397 415 L403 415 Z" fill="#000000" opacity="0.6"/>

  <!-- Boca (pequeña sonrisa confiada) -->
  <path d="M378 440 Q400 452 422 440" stroke="#00000" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Collar dorado -->
  <path d="M350 500 Q400 545 450 500" stroke="#fbbf24" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M400 522 L400 555" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="565" r="12" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>

  <!-- Texto de código flotante (detalles) -->
  <text x="120" y="200" font-family="monospace" font-size="100" fill="#ecec0a" opacity="10">{ }</text>
  <text x="640" y="620" font-family="monospace" font-size="100" fill="#ecec0a" opacity="10">&lt;/&gt;</text>
  <text x="100" y="600" font-family="monospace" font-size="100" fill="#ecec0a" opacity="10">Java</text>
  <text x="620" y="200" font-family="monospace" font-size="100" fill="#ecec0a" opacity="10">Spring</text>

  <!-- NOMBRE -->
  <text x="400" y="690" text-anchor="middle" font-family="monospace" font-size="40" font-weight="bold" fill="#ecec0a">&gt; DIDIER<tspan fill="#ecec0a">_</tspan></text>
  <text x="400" y="725" text-anchor="middle" font-family="Poppins, sans-serif" font-size="18" fill="#ecec0a">Backend Developer · Java/Spring Boot</text>
</svg>